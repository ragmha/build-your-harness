name: Step 5

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  lesson:
    permissions:
      actions: write
      contents: read
      issues: write
    uses: ./.github/workflows/_lesson.yml
    with:
      step-number: 5
      next-step-number: 6
      current-workflow: "Step 5"
      next-workflow: "Step 6"
      next-step-file: ".github/steps/6-step.md"
      grade-command: "bun run grade:step5"
      grade-description: "Policy and idempotent-effect tests"
