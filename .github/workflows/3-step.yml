name: Step 3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  lesson:
    permissions:
      actions: write
      contents: read
      issues: write
    uses: ./.github/workflows/_lesson.yml
    with:
      step-number: 3
      next-step-number: 4
      current-workflow: "Step 3"
      next-workflow: "Step 4"
      next-step-file: ".github/steps/4-step.md"
      grade-command: "bun run grade:step3 && bun run eval"
      grade-description: "Context projection, skill, and evaluation tests"
