name: Step 6

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  REVIEW_FILE: ".github/steps/x-review.md"

jobs:
  find_exercise:
    name: Find Exercise Issue
    permissions:
      issues: read
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@eca07ac3f4900e6112150366ac9e89cdf09e30e6 # v0.9.1
    with:
      issue-title-text: "Exercise: Build Your Agent Harness"

  check_step_work:
    name: Grade complete harness
    runs-on: ubuntu-latest
    needs: [find_exercise]
    permissions:
      contents: read
      issues: write
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Get response templates
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: eca07ac3f4900e6112150366ac9e89cdf09e30e6 # v0.9.1

      - name: Find progress comment
        id: find-last-comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-author: "github-actions[bot]"
          direction: last

      - name: Show checking status
        uses: GrantBirki/comment@608e41b19bc973020ec0e189ebfdae935d7fe0cc # v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: exercise-toolkit/markdown-templates/step-feedback/checking-work.md
          edit-mode: replace

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check complete project
        id: typecheck
        continue-on-error: true
        run: bun run typecheck

      - name: Run complete test suite
        id: tests
        continue-on-error: true
        run: bun run grade:step6

      - name: Generate evaluation report
        id: eval
        continue-on-error: true
        run: bun run eval

      - name: Post final results
        uses: GrantBirki/comment@608e41b19bc973020ec0e189ebfdae935d7fe0cc # v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          edit-mode: replace
          file: exercise-toolkit/markdown-templates/step-feedback/step-results-table.md
          vars: |
            step_number: 6
            results_table:
              - description: "Strict TypeScript type-check"
                passed: ${{ steps.typecheck.outcome == 'success' }}
              - description: "Complete deterministic test suite"
                passed: ${{ steps.tests.outcome == 'success' }}
              - description: "Machine-readable evaluation report"
                passed: ${{ steps.eval.outcome == 'success' }}

      - name: Require all checks
        if: steps.typecheck.outcome != 'success' || steps.tests.outcome != 'success' || steps.eval.outcome != 'success'
        run: exit 1

  post_review_content:
    name: Post review
    needs: [find_exercise, check_step_work]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Get response templates
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: eca07ac3f4900e6112150366ac9e89cdf09e30e6 # v0.9.1

      - name: Post lesson review transition
        uses: GrantBirki/comment@608e41b19bc973020ec0e189ebfdae935d7fe0cc # v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/lesson-review.md

      - name: Post review content
        uses: GrantBirki/comment@608e41b19bc973020ec0e189ebfdae935d7fe0cc # v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.REVIEW_FILE }}

  disable_current_workflow:
    name: Disable Step 6
    needs: [post_review_content]
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Disable Step 6
        run: gh workflow disable "${{ github.workflow }}" --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finish_exercise:
    name: Finish Exercise
    needs: [find_exercise, post_review_content, disable_current_workflow]
    permissions:
      contents: write
      issues: write
    uses: skills/exercise-toolkit/.github/workflows/finish-exercise.yml@eca07ac3f4900e6112150366ac9e89cdf09e30e6 # v0.9.1
    with:
      issue-url: ${{ needs.find_exercise.outputs.issue-url }}
      exercise-title: "Build Your Agent Harness"
